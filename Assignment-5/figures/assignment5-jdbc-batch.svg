<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><rect width="900" height="380" fill="white"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#17324d">100,000-row JDBC insertion time</text><g font-family="Arial" font-size="17" fill="#222"><text x="60" y="115">Batch + transaction</text><rect x="275" y="88" width="90" height="40" rx="5" fill="#2a9d8f"/><text x="380" y="115">2.71 s</text><text x="60" y="195">Prepared row-by-row</text><rect x="275" y="168" width="690" height="40" rx="5" fill="#e76f51"/><text x="800" y="195" fill="white">20.71 s</text><text x="60" y="275">Batch auto-commit</text><rect x="275" y="248" width="562" height="40" rx="5" fill="#457b9d"/><text x="850" y="275">16.85 s</text><text x="450" y="340" text-anchor="middle" fill="#17324d">Batch + one transaction: about 7.6× faster than row-by-row PreparedStatement</text></g></svg>